; ALTERNATIVE to WLED. Reference board: ESP32-WROOM-32 DevKit.
; Not yet built with PlatformIO by any agent. Pick ONE environment:
;   pio run -e ring144        ring only, 55 px (recommended first bench test)
;   pio run -e full144        ring 55 + hand 25 + crystal 11 = 91 px
;   pio run -e full60         ring 21 + hand 10 + crystal 4 = 35 px (60 LEDs/m fallback)
; Change pins or the current ceiling with -DLED_PIN=.. -DMODE_PIN=.. -DACTION_PIN=.. -DLIMIT_MA=..
[env]
platform = espressif32
board = esp32dev   ; Sparkle Motion Mini uses a classic ESP32 module
framework = arduino
monitor_speed = 115200
lib_deps = adafruit/Adafruit NeoPixel@^1.12.3

[env:ring144]
build_flags = -DRING_ONLY -DLIMIT_MA=1000

[env:full144]
build_flags = -DLIMIT_MA=1000

[env:full60]
build_flags = -DLAYOUT_60 -DLIMIT_MA=1000
